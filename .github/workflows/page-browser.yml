name: Page browser scripts
on:
  pull_request:
    paths:
      - 'apps/room/page/**'
      - 'apps/room/brand/**'
      - 'apps/room/fetch.ts'
      - 'apps/room/lanes/test/demo.scope.test.ts'
      - 'scripts/demo-captures.ts'
      - 'scripts/demo/**'
      - '.github/workflows/page-browser.yml'
  push:
    branches: ['**']
    paths:
      - 'apps/room/page/**'
      - 'apps/room/brand/**'
      - 'apps/room/fetch.ts'
      - 'apps/room/lanes/test/demo.scope.test.ts'
      - 'scripts/demo-captures.ts'
      - 'scripts/demo/**'
      - '.github/workflows/page-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Install the pinned browser tools in a scratch directory
        env:
          # The script asserts this version, and this version's browsers.json names this revision.
          PLAYWRIGHT_VERSION: 1.63.0
          PLAYWRIGHT_INTEGRITY: sha512-rYCsBF/M5HjUch52bbtVONEFjv6Xu8sm8h72dNlR5bzIE1fvC/bxgspzkjSfU+MweEMmPM8KJebG6nnyxo5mCg==
          CHROMIUM_REVISION: '1243'
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/browser-tools"
          mkdir -p "$tools"
          npm install --prefix "$tools" --ignore-scripts --no-audit --no-fund --save-exact "playwright-core@$PLAYWRIGHT_VERSION"
          core="$tools/node_modules/playwright-core"
          [ "$(node -p "require('$tools/package-lock.json').packages['node_modules/playwright-core'].integrity")" = "$PLAYWRIGHT_INTEGRITY" ]
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright"
          node "$core/cli.js" install --with-deps --no-shell chromium
          chromium=$(node -p "require('$core').chromium.executablePath()")
          [[ "$chromium" == "$PLAYWRIGHT_BROWSERS_PATH/chromium-$CHROMIUM_REVISION/"* ]]
          [ -x "$chromium" ]
          echo "PLAYWRIGHT_CORE=$core" >> "$GITHUB_ENV"
          echo "CHROMIUM=$chromium" >> "$GITHUB_ENV"
      - name: Run the page screenshot script
        env:
          VIEW_CAPTURE_OUT: /tmp/page-screens
        run: node apps/room/page/test/screens.mjs
      - name: Run the recorded demo captures
        run: node --import tsx --no-warnings scripts/demo-captures.ts --recorded --out /tmp/demo-captures
      - name: Run the create room witness
        run: node --import tsx --no-warnings scripts/demo-captures.ts --recorded --claim-witness --out /tmp/claim-witness
      - name: Run the local label witness
        run: node --import tsx --no-warnings scripts/demo-captures.ts --recorded --label-witness --out /tmp/label-witness
