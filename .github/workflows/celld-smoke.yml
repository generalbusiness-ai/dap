name: Local Worker smoke
on:
  pull_request:
    paths:
      - 'packages/scope/**'
      - 'packages/mcp/**'
      - 'apps/room/**'
      - 'scripts/celld-smoke*'
      - 'scripts/test-celld-proxy*'
      - '.github/workflows/celld-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'packages/scope/**'
      - 'packages/mcp/**'
      - 'apps/room/**'
      - 'scripts/celld-smoke*'
      - 'scripts/test-celld-proxy*'
      - '.github/workflows/celld-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Obtain the pinned runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(cat apps/room/celld/celld.version)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset="$RUNNER_TEMP/celld-x86_64-unknown-linux-gnu.gz"
          curl --fail --location --proto '=https' --tlsv1.2 "https://github.com/denoland/celld/releases/download/$tag/celld-x86_64-unknown-linux-gnu.gz" --output "$asset"
          gh attestation verify "$asset" --repo denoland/celld
          gzip --decompress --stdout "$asset" > "$RUNNER_TEMP/celld"
          chmod 700 "$RUNNER_TEMP/celld"
      - name: Exercise the actual local Worker through the proxy
        env:
          CELLD_BIN: ${{ runner.temp }}/celld
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/test-celld-proxy.mjs
