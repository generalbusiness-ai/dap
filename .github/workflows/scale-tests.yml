name: Scale witnesses on main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Run every unchanged scale witness after the landing
        env:
          ARTROOM_SCALE_DEADLINE_FACTOR: '3'
        run: node scripts/scale-runner.mjs "$RUNNER_TEMP/artroom-scale"
      - name: Retain the full scale output and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scale-witnesses-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artroom-scale/
          if-no-files-found: error
          retention-days: 7
